<script>
  // Wipe Babel-standalone's localStorage cache so file edits show up on reload.
  try { Object.keys(localStorage).filter(k => k.startsWith('babel-cache')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
</script>

<div id="root">
  <!-- Vises, mens browseren oversætter appen (ca. 5-10 s). React erstatter det, når appen er klar. -->
  <div role="status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--c-bg,#f7f7f5);color:var(--c-text-2,#5b6068);font-family:var(--font,system-ui,sans-serif);font-size:14px;">
    <span id="cw-boot-text">Indlæser demoen …</span>
  </div>
  <script>
    try { if (localStorage.getItem('cw_lang') === 'en') document.getElementById('cw-boot-text').textContent = 'Loading the demo …'; } catch (e) {}
  </script>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script>
  // Babel skriver en note (som console.error), når en fil er over 500 KB og derfor ikke formateres pænt.
  // Det er en byggenote i browseren, ikke en fejl i appen, så den holdes ude af konsollen.
  (function () { var err = console.error; console.error = function (m) { if (typeof m === 'string' && m.indexOf('[BABEL] Note: The code generator has deoptimised') === 0) return; return err.apply(console, arguments); }; })();
</script>
