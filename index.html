<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"/>
<title>Crediwire · Credit tool</title>
<meta name="viewport" content="width=1280"/>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
<meta http-equiv="Pragma" content="no-cache"/>
<!-- CrediWire-designsystemets skrift (som i frontend-app) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700&display=swap"/>
<!-- SheetJS 0.20.3 fra SheetJS' eget CDN (cdnjs har kun 0.18.5, som har kendte sårbarheder ved læsning af filer, fx "Importér budget").
     integrity låser filen: ændres den på CDN'et, indlæses den ikke. Skal være indlæst, før appens moduler kører (mapping.js læser window.XLSX) -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
</head>
<body>
<div id="app">
  <!-- Vises, indtil appen er klar -->
  <div role="status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;color:rgba(0,0,0,.45);font-family:'Source Sans Pro',system-ui,sans-serif;font-size:14px;">
    <span id="cw-boot-text">Indlæser demoen …</span>
  </div>
  <script>
    try { if (localStorage.getItem('cw_lang') === 'en') document.getElementById('cw-boot-text').textContent = 'Loading the demo …'; } catch (e) {}
  </script>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
